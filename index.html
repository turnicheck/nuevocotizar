<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador de Servicios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cobalt: { 400: '#3377ff', 500: '#0055ff', 600: '#0044cc' },
                        dark: { bg: '#050505', card: '#121212', input: '#1a1a1a', border: '#2a2a2a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        .select-arrow {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M7%2010L12%2015L17%2010%22%20stroke%3D%22%239CA3AF%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E");
            background-size: 24px 24px;
            background-position: right 1rem center;
            background-repeat: no-repeat;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-dark-bg text-gray-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-cobalt-500 selection:text-white">

    <main class="w-full max-w-md bg-dark-card border border-dark-border rounded-3xl shadow-2xl overflow-hidden flex flex-col mt-4 mb-4">

        <header class="pt-8 px-8 pb-6 text-center">
            <h1 class="text-2xl font-semibold tracking-tight">Cotizador Web</h1>
            <p class="text-gray-400 text-sm mt-2">Calcula tu presupuesto en tiempo real</p>
        </header>

        <div class="px-8 mb-6">
            <div class="flex p-1 bg-dark-input rounded-xl border border-dark-border">
                <button type="button" onclick="switchTab('similitud')" id="tab-similitud" class="flex-1 py-2.5 text-xs sm:text-sm font-medium rounded-lg transition-all duration-200 bg-cobalt-500 text-white shadow-md">Similitud</button>
                <button type="button" onclick="switchTab('ia')" id="tab-ia" class="flex-1 py-2.5 text-xs sm:text-sm font-medium rounded-lg transition-all duration-200 text-gray-400 hover:text-gray-200">Reducción IA</button>
                <button type="button" onclick="switchTab('ambas')" id="tab-ambas" class="flex-1 py-2.5 text-xs sm:text-sm font-medium rounded-lg transition-all duration-200 text-gray-400 hover:text-gray-200">Ambas</button>
            </div>
        </div>

        <div class="px-8 flex-1">

            <!-- SIMILITUD -->
            <form id="form-similitud" class="space-y-5" onsubmit="return false">
                <div class="space-y-1.5">
                    <label for="sim-words" class="block text-sm font-medium text-gray-300">Número de palabras</label>
                    <input type="number" id="sim-words" inputmode="numeric" min="0" placeholder="Ej. 1500"
                        class="w-full bg-dark-input border border-dark-border rounded-xl px-4 py-3.5 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-cobalt-500 focus:border-transparent transition-all">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label for="sim-curr" class="block text-sm font-medium text-gray-300">Actual (%)</label>
                        <input type="number" id="sim-curr" inputmode="decimal" min="0" max="100" placeholder="0"
                            class="w-full bg-dark-input border border-dark-border rounded-xl px-4 py-3.5 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-cobalt-500 focus:border-transparent transition-all">
                    </div>
                    <div class="space-y-1.5">
                        <label for="sim-req" class="block text-sm font-medium text-gray-300">Requerido (%)</label>
                        <input type="number" id="sim-req" inputmode="decimal" min="0" max="100" placeholder="0"
                            class="w-full bg-dark-input border border-dark-border rounded-xl px-4 py-3.5 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-cobalt-500 focus:border-transparent transition-all">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="sim-reports" class="block text-sm font-medium text-gray-300">Reportes adicionales</label>
                    <select id="sim-reports" class="select-arrow w-full bg-dark-input border border-dark-border rounded-xl px-4 py-3.5 text-white focus:outline-none focus:ring-2 focus:ring-cobalt-500 focus:border-transparent transition-all">
                        <option value="0">0 Reportes (S/. 0)</option>
                        <option value="1">1 Reporte (S/. 5)</option>
                        <option value="2">2 Reportes (S/. 10)</option>
                        <option value="3">3 Reportes (S/. 15)</option>
                        <option value="4">4 Reportes (S/. 20)</option>
                    </select>
                </div>

                <div id="sim-error" class="hidden text-red-400 text-xs font-medium bg-red-900/20 border border-red-900/50 rounded-lg p-3"></div>
            </form>

            <!-- REDUCCIÓN IA -->
            <form id="form-ia" class="hidden space-y-5" onsubmit="return false">
                <div class="space-y-1.5">
                    <label for="ia-words" class="block text-sm font-medium text-gray-300">Número de palabras</label>
                    <input type="number" id="ia-words" inputmode="numeric" min="0" placeholder="Ej. 1500"
                        class="w-full bg-dark-input border border-dark-border rounded-xl px-4 py-3.5 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-cobalt-500 focus:border-transparent transition-all">
                </div>

                <div class="space-y-1.5">
                    <label for="ia-curr" class="block text-sm font-medium text-gray-300">Porcentaje actual de IA (%)</label>
                    <input type="number" id="ia-curr" inputmode="decimal" min="0" max="100" placeholder="Ej. 85"
                        class="w-full bg-dark-input border border-dark-border rounded-xl px-4 py-3.5 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-cobalt-500 focus:border-transparent transition-all">
                </div>

                <div class="space-y-1.5">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Meta de reducción</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="relative flex items-center justify-center p-3 border border-dark-border rounded-xl cursor-pointer hover:bg-dark-input transition-colors has-[:checked]:border-cobalt-500 has-[:checked]:bg-cobalt-500/10">
                            <input type="radio" name="ia-target" value="10" checked class="sr-only">
                            <span class="text-sm font-medium text-gray-200">Reducir a *%</span>
                        </label>
                        <label class="relative flex items-center justify-center p-3 border border-dark-border rounded-xl cursor-pointer hover:bg-dark-input transition-colors has-[:checked]:border-cobalt-500 has-[:checked]:bg-cobalt-500/10">
                            <input type="radio" name="ia-target" value="0" class="sr-only">
                            <span class="text-sm font-medium text-gray-200">Reducir a 0%</span>
                        </label>
                    </div>
                </div>

                <div id="ia-error" class="hidden text-red-400 text-xs font-medium bg-red-900/20 border border-red-900/50 rounded-lg p-3"></div>
            </form>

            <!-- AMBAS -->
            <form id="form-ambas" class="hidden space-y-5" onsubmit="return false">
                <div class="space-y-1.5">
                    <label for="ambas-words" class="block text-sm font-medium text-gray-300">Número de palabras (Total)</label>
                    <input type="number" id="ambas-words" inputmode="numeric" min="0" placeholder="Ej. 1500"
                        class="w-full bg-dark-input border border-dark-border rounded-xl px-4 py-3.5 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-cobalt-500 focus:border-transparent transition-all">
                </div>

                <div class="pt-2 border-t border-dark-border/50">
                    <h3 class="text-sm font-semibold text-cobalt-400 mb-3">1. Similitud</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label for="ambas-sim-curr" class="block text-sm font-medium text-gray-300">Actual (%)</label>
                            <input type="number" id="ambas-sim-curr" inputmode="decimal" min="0" max="100" placeholder="0"
                                class="w-full bg-dark-input border border-dark-border rounded-xl px-4 py-3.5 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-cobalt-500 focus:border-transparent transition-all">
                        </div>
                        <div class="space-y-1.5">
                            <label for="ambas-sim-req" class="block text-sm font-medium text-gray-300">Requerido (%)</label>
                            <input type="number" id="ambas-sim-req" inputmode="decimal" min="0" max="100" placeholder="0"
                                class="w-full bg-dark-input border border-dark-border rounded-xl px-4 py-3.5 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-cobalt-500 focus:border-transparent transition-all">
                        </div>
                    </div>

                    <div class="space-y-1.5 mt-4">
                        <label for="ambas-sim-reports" class="block text-sm font-medium text-gray-300">Reportes adicionales</label>
                        <select id="ambas-sim-reports" class="select-arrow w-full bg-dark-input border border-dark-border rounded-xl px-4 py-3.5 text-white focus:outline-none focus:ring-2 focus:ring-cobalt-500 focus:border-transparent transition-all">
                            <option value="0">0 Reportes (S/. 0)</option>
                            <option value="1">1 Reporte (S/. 5)</option>
                            <option value="2">2 Reportes (S/. 10)</option>
                            <option value="3">3 Reportes (S/. 15)</option>
                            <option value="4">4 Reportes (S/. 20)</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4 border-t border-dark-border/50">
                    <h3 class="text-sm font-semibold text-cobalt-400 mb-3">2. Reducción IA</h3>
                    <div class="space-y-3">
                        <div class="space-y-1.5">
                            <label for="ambas-ia-curr" class="block text-sm font-medium text-gray-300">IA Actual (%)</label>
                            <input type="number" id="ambas-ia-curr" inputmode="decimal" min="0" max="100" placeholder="0"
                                class="w-full bg-dark-input border border-dark-border rounded-xl px-4 py-3.5 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-cobalt-500 focus:border-transparent transition-all">
                        </div>
                        <div class="space-y-1.5">
                            <label class="block text-sm font-medium text-gray-300 mb-2">Meta IA</label>
                            <div class="grid grid-cols-2 gap-3">
                                <label class="relative flex items-center justify-center p-3 border border-dark-border rounded-xl cursor-pointer hover:bg-dark-input transition-colors has-[:checked]:border-cobalt-500 has-[:checked]:bg-cobalt-500/10">
                                    <input type="radio" name="ambas-ia-target" value="10" checked class="sr-only">
                                    <span class="text-sm font-medium text-gray-200">Reducir a *%</span>
                                </label>
                                <label class="relative flex items-center justify-center p-3 border border-dark-border rounded-xl cursor-pointer hover:bg-dark-input transition-colors has-[:checked]:border-cobalt-500 has-[:checked]:bg-cobalt-500/10">
                                    <input type="radio" name="ambas-ia-target" value="0" class="sr-only">
                                    <span class="text-sm font-medium text-gray-200">Reducir a 0%</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="ambas-error" class="hidden text-red-400 text-xs font-medium bg-red-900/20 border border-red-900/50 rounded-lg p-3"></div>
            </form>

        </div>

        <div class="mt-8 bg-dark-input border-t border-dark-border p-8 flex flex-col items-center justify-center">
            <span class="text-sm font-medium text-gray-400 mb-1 uppercase tracking-wider">Costo Estimado</span>
            <div class="text-4xl sm:text-5xl font-bold text-white tracking-tight flex items-baseline gap-1 transition-all" id="result-display">
                <span class="text-2xl sm:text-3xl text-cobalt-400">S/.</span> 0.00
            </div>
            <p class="text-xs text-gray-500 mt-3 text-center">El total se redondea a múltiplo de 5 (se ignoran los decimales: 25.89 → 25, 26.50 → 30).</p>
        </div>

    </main>

    <script>
        let currentTab = 'similitud';

        const $ = id => document.getElementById(id);

        const forms = { similitud: $('form-similitud'), ia: $('form-ia'), ambas: $('form-ambas') };
        const tabs = { similitud: $('tab-similitud'), ia: $('tab-ia'), ambas: $('tab-ambas') };
        const errors = { similitud: $('sim-error'), ia: $('ia-error'), ambas: $('ambas-error') };
        const resultDisplay = $('result-display');

        const activeTabClasses = ['bg-cobalt-500', 'text-white', 'shadow-md'];
        const inactiveTabClasses = ['text-gray-400', 'hover:text-gray-200', 'bg-transparent'];

        // Cualquier cambio en un formulario recalcula
        Object.values(forms).forEach(f => {
            f.addEventListener('input', calculate);
            f.addEventListener('change', calculate);
        });

        function switchTab(tab) {
            if (currentTab === tab) return;
            currentTab = tab;

            Object.values(forms).forEach(f => { f.reset(); f.classList.add('hidden'); });
            Object.values(errors).forEach(e => e.classList.add('hidden'));
            Object.values(tabs).forEach(t => {
                t.classList.remove(...activeTabClasses);
                t.classList.add(...inactiveTabClasses);
            });

            forms[tab].classList.remove('hidden');
            tabs[tab].classList.remove(...inactiveTabClasses);
            tabs[tab].classList.add(...activeTabClasses);

            updateDisplay(0);
        }

        /* ---------- Redondeo ----------
           Se ignoran los decimales y luego se sube al múltiplo de 5:
           25 → 25 | 25.89 → 25 | 26.50 → 30 | 27.84 → 30 | 28.90 → 30 | 29 → 30 | 30 → 30 */
        function roundCost(value) {
            if (value <= 0) return 0;
            const whole = Math.floor(value + 1e-9); // evita errores de punto flotante
            return Math.ceil(whole / 5) * 5;
        }

        function updateDisplay(value) {
            const formatted = new Intl.NumberFormat('es-PE', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(value);
            resultDisplay.innerHTML = `<span class="text-2xl sm:text-3xl text-cobalt-400">S/.</span> ${formatted}`;
        }

        function showError(key, msg) {
            errors[key].innerHTML = msg;
            errors[key].classList.remove('hidden');
            updateDisplay(0);
        }

        function hideError(key) { errors[key].classList.add('hidden'); }

        function getRadio(name) {
            const checked = document.querySelector(`input[name="${name}"]:checked`);
            return checked ? parseInt(checked.value) : 10;
        }

        /* ---------- Fórmulas (sin redondear) ---------- */

        // palabras * (% actual - % requerido) * 0.05 + reportes adicionales (S/. 5 c/u)
        function similitudCost(words, current, required, reports) {
            return words * ((current - required) / 100) * 0.05 + reports * 5;
        }

        // Meta *% (10%): palabras * (% actual - 10%) * 0.01 + 5
        // Meta 0%:       palabras * (% actual) * 0.01 + 25
        function iaCost(words, current, target) {
            if (target === 10) return words * ((current - 10) / 100) * 0.01 + 5;
            return words * (current / 100) * 0.01 + 25;
        }

        /* ---------- Cálculo por pestaña ---------- */

        function calculate() {
            if (currentTab === 'similitud') calculateSimilitud();
            else if (currentTab === 'ia') calculateIA();
            else calculateAmbas();
        }

        function calculateSimilitud() {
            const words = parseFloat($('sim-words').value) || 0;
            const current = parseFloat($('sim-curr').value) || 0;
            const required = parseFloat($('sim-req').value) || 0;
            const reports = parseInt($('sim-reports').value) || 0;

            if (words > 0 && current > 0) {
                if (current <= required) {
                    return showError('similitud', 'El porcentaje actual debe ser mayor al requerido.');
                }
                hideError('similitud');
                updateDisplay(roundCost(similitudCost(words, current, required, reports)));
            } else {
                hideError('similitud');
                updateDisplay(0);
            }
        }

        function calculateIA() {
            const words = parseFloat($('ia-words').value) || 0;
            const current = parseFloat($('ia-curr').value) || 0;
            const target = getRadio('ia-target');

            if (words > 0 && current > 0) {
                if (target === 10 && current <= 10) {
                    return showError('ia', 'El porcentaje actual debe ser mayor a la meta (10%).');
                }
                hideError('ia');
                updateDisplay(roundCost(iaCost(words, current, target)));
            } else {
                hideError('ia');
                updateDisplay(0);
            }
        }

        function calculateAmbas() {
            const words = parseFloat($('ambas-words').value) || 0;
            const simCurr = parseFloat($('ambas-sim-curr').value) || 0;
            const simReq = parseFloat($('ambas-sim-req').value) || 0;
            const reports = parseInt($('ambas-sim-reports').value) || 0;
            const iaCurr = parseFloat($('ambas-ia-curr').value) || 0;
            const iaTarget = getRadio('ambas-ia-target');

            if (!(words > 0 && (simCurr > 0 || iaCurr > 0))) {
                hideError('ambas');
                updateDisplay(0);
                return;
            }

            const msgs = [];
            let total = 0;

            if (simCurr > 0) {
                if (simCurr <= simReq) msgs.push('Similitud: el actual debe ser mayor al requerido.');
                else total += similitudCost(words, simCurr, simReq, reports);
            }

            if (iaCurr > 0) {
                if (iaTarget === 10 && iaCurr <= 10) msgs.push('IA: para meta de 10%, el actual debe ser mayor.');
                else total += iaCost(words, iaCurr, iaTarget);
            }

            if (msgs.length) return showError('ambas', msgs.join('<br>'));

            hideError('ambas');
            // Se suman ambos servicios y se redondea una sola vez al final
            updateDisplay(roundCost(total));
        }
    </script>
</body>
</html>
